{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
    <h2>🗑️ Eliminar Curso</h2>
    <p>¿Estás seguro de que deseas eliminar el curso <strong>{{ object.nombre_curso }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a href="{% url 'curso_lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
