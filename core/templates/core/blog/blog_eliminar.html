{% extends "base.html" %}

{% block title %}Eliminar Blog{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body text-center">
        <h4 class="mb-3 text-danger"><i class="bi bi-exclamation-triangle"></i> Confirmar eliminación</h4>
        <p>¿Estás seguro de que deseas eliminar el blog <strong>{{ blog.titulo }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">
                <i class="bi bi-trash"></i> Sí, eliminar
            </button>
            <a href="{% url 'blog_list' %}" class="btn btn-secondary">
                <i class="bi bi-arrow-left"></i> Cancelar
            </a>
        </form>
    </div>
</div>
{% endblock %}
