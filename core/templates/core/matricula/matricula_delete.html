{% extends "base.html" %}

{% block title %}Eliminar Matrícula{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3><i class="bi bi-trash"></i> Eliminar Matrícula</h3>
    <p>¿Estás seguro de eliminar la matrícula de <strong>{{ object.usuario }}</strong> en el curso <strong>{{ object.curso }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'matricula_lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
