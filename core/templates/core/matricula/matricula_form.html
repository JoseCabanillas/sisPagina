{% extends "base.html" %}

{% block title %}Formulario Matrícula{% endblock %}

{% block content %}
<div class="container mt-4">
    <h3><i class="bi bi-pencil-square"></i> Matrícula</h3>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Guardar</button>
        <a href="{% url 'matricula_lista' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
