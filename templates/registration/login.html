{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
                </h4>
            </div>
            <div class="card-body">

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
                            {{ message }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post" autocomplete="off">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_usuario" class="form-label">Usuario</label>
                        <input type="text" name="usuario" id="id_usuario" class="form-control" autocomplete="off">
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Contraseña</label>
                        <input type="password" name="password" id="id_password" class="form-control" autocomplete="new-password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </button>
                </form>

                <div class="text-center mt-3">
                    <a href="{% url 'servicio_publico' %}" class="text-decoration-none">
                        <i class="bi bi-arrow-left-circle"></i> Volver a la página pública
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
