name: Alerta Dinámica de Tareas

on:
  schedule:
    # Se ejecuta todos los días a las 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: pip install requests

      - name: Leer tareas y enviar alertas
        run: |
          python -c '
          import csv
          import requests
          from datetime import datetime, date

          topico_ntfy = "AQUI_TU_TOPICO"  # <--- Cambia por tu tópico de ntfy
          url = f"https://ntfy.sh/{topico_ntfy}"

          # Abrir el archivo CSV
          with open("tareas.csv", mode="r", encoding="utf-8") as archivo:
              lector = csv.DictReader(archivo)
              
              for fila in lector:
                  tarea = fila["tarea"]
                  responsable = fila["responsable"]
                  fecha_limite_str = fila["fecha_limite"]

                  # Cálculo automático de días restantes
                  fecha_limite = datetime.strptime(fecha_limite_str, "%Y-%m-%d").date()
                  hoy = date.today()
                  dias_restantes = (fecha_limite - hoy).days

                  # Formato del mensaje para cada tarea
                  mensaje = f"""📌 Tarea: {tarea}
          👤 Responsable: {responsable}
          📅 Vencimiento: {fecha_limite.strftime("%d/%m/%Y")}
          ⏳ Días restantes: {dias_restantes} días"""

                  # Enviar alerta por cada tarea
                  requests.post(url, data=mensaje.encode("utf-8"))
          '
