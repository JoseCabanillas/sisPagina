name: Alerta Automática de Tareas

on:
  schedule:
    # Se ejecuta todos los días a las 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: pip install requests

      - name: Calcular fechas y enviar alerta
        run: |
          python -c '
          import requests
          from datetime import datetime, date

          # ----------------------------------------------------
          # CONFIGURACIÓN DE LA TAREA (Ajusta estos datos)
          # ----------------------------------------------------
          tarea = "Entrega del informe final"
          responsable = "José Luis"
          fecha_limite_str = "2026-11-15"  # Formato: AAAA-MM-DD
          topico_ntfy = "AQUI_TU_TOPICO"     # Tu tópico exacto de ntfy
          # ----------------------------------------------------

          # Cálculo automático de días restantes
          fecha_limite = datetime.strptime(fecha_limite_str, "%Y-%m-%d").date()
          hoy = date.today()
          dias_restantes = (fecha_limite - hoy).days

          # Formato del mensaje
          mensaje = f"""📌 Tarea: {tarea}
          👤 Responsable: {responsable}
          📅 Fecha de vencimiento: {fecha_limite.strftime("%d/%m/%Y")}
          ⏳ Días restantes: {dias_restantes} días"""

          # Envío de la notificación
          url = f"https://ntfy.sh/{topico_ntfy}"
          requests.post(url, data=mensaje.encode("utf-8"))
          '
