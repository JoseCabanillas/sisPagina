name: Alerta Automática

on:
  schedule:
    # Se ejecuta todos los días a las 13:00 UTC (ajusta la hora a tu conveniencia)
    - cron: '0 13 * * *'
  # Esto te permite probarlo manualmente desde la web de GitHub cuando quieras
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar notificación a ntfy
        run: |
          curl -d "🤖 ¡Alerta automática desde GitHub Actions!" https://ntfy.sh/mis_alertas
