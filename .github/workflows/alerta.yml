name: Alerta Dinámica de Tareas

on:
  schedule:
    - cron: '58 21 * * *'   # 13:00 UTC = 08:00 hora Perú
  workflow_dispatch:

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: pip install requests

      - name: Enviar alertas
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alertas.py

      - name: Avisar si falló
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Falló el workflow de alertas" -H "Priority: high" -H "Tags: x" \
            -d "Revisa la pestaña Actions del repositorio." \
            "https://ntfy.sh/$NTFY_TOPIC"
