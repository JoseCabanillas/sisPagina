name: Alerta Dinámica de Tareas

on:
  schedule:
    # Se ejecuta todos los días a las 19:09 UTC (14:09 Hora Perú)
    - cron: '44 21 * * *'
  workflow_dispatch:

jobs:
  enviar-alerta:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: pip install requests

      - name: Ejecutar script de alertas
        run: python alertas.py
